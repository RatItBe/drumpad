<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>보이스 드럼패드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 시작 화면: 아이폰 사파리는 사용자 터치 후에만 소리가 난다 -->
  <div id="start-screen" class="overlay start-screen">
    <div class="start-box">
      <h1>보이스 드럼패드</h1>
      <p>목소리나 주변 소리를 녹음해 16개 패드에 담고, 두드리며 놀아 보세요.</p>
      <button id="start-btn" type="button" class="btn btn-primary btn-big">시작하기</button>
    </div>
  </div>

  <header class="app-header">
    <h1>보이스 드럼패드</h1>
    <div class="toolbar">
      <button id="clear-all-btn" type="button" class="btn btn-danger" hidden>전체 초기화</button>
      <button id="edit-toggle-btn" type="button" class="btn">수정 모드</button>
    </div>
  </header>

  <div id="edit-banner" class="banner edit-banner" hidden>
    수정 모드: 패드를 누르면 그 패드의 메뉴가 열립니다
  </div>
  <div id="move-banner" class="banner move-banner" hidden>
    <span id="move-text"></span>
    <button id="move-cancel-btn" type="button" class="btn btn-small">취소</button>
  </div>

  <main class="app-main">
    <section id="pad-grid" class="pad-grid" aria-label="패드"></section>
    <p class="hint">키보드: 4 5 6 7 / R T Y U / F G H J / V B N M</p>
  </main>

  <!-- 패드 메뉴 (수정 모드) -->
  <div id="menu-modal" class="overlay modal" hidden>
    <div class="modal-box">
      <h2 id="menu-title">패드</h2>
      <div id="menu-actions" class="menu-actions"></div>
      <button id="menu-close-btn" type="button" class="btn btn-ghost">닫기</button>
    </div>
  </div>

  <!-- 녹음 화면 -->
  <div id="record-modal" class="overlay modal" hidden>
    <div class="modal-box">
      <h2 id="record-title">녹음</h2>
      <div id="record-indicator" class="record-indicator">
        <span class="rec-dot"></span>
        <span id="record-time">0.0 / 5.0초</span>
      </div>
      <p id="record-status" class="status">녹음 시작을 누르면 마이크 권한을 요청합니다. 최대 5초.</p>
      <div class="modal-buttons">
        <button id="record-btn" type="button" class="btn btn-primary">녹음 시작</button>
        <button id="record-cancel-btn" type="button" class="btn btn-ghost">취소</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
